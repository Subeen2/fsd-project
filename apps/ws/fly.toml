# fly.toml app configuration file generated for fsd-ws on 2026-05-19T12:41:53+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fsd-ws'
primary_region = 'nrt'

[build]
  dockerfile = '../../Dockerfile.ws'

[env]
  HOST = '0.0.0.0'
  NODE_ENV = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
